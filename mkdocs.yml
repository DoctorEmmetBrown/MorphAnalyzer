site_name: morphanalyzer
site_description: Analyse morphologique 3D de milieux cellulaires et poreux — portage Python d'iMorph
repo_url: https://github.com/DoctorEmmetBrown/MorphAnalyzer
repo_name: MorphAnalyzer
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site

theme:
  name: material
  language: fr
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Passer au thème sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Passer au thème clair

nav:
  - Accueil: index.md
  - Installation: installation.md
  - Guide:
      - Conventions: guide/conventions.md
      - Sans interface graphique: guide/sans-gui.md
      - La chaîne complète: guide/chaine-complete.md
      - Classification de forme: guide/classification-forme.md
      - Squelette de Plateau: guide/plateau.md
      - Tortuosité: guide/tortuosite.md
      - Drainage et réseau: guide/drainage.md
      - Os cortical: guide/cortical.md
      - Maillage et export: guide/maillage.md
      - L'interface: guide/interface.md
      - Les rampes de couleur: guide/couleurs.md
  - Validation: validation.md
  - Portage depuis iMorph:
      - Carte de portage: PORTING_MAP.md
      - Inventaire d'iMorph 3.2: INVENTAIRE_IMORPH32.md
      - Architecture: ARCHITECTURE.md
  - Référence d'API: reference/api.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true

plugins:
  - search:
      lang: fr
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            filters: ["!^_"]
            heading_level: 3

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/DoctorEmmetBrown/MorphAnalyzer
